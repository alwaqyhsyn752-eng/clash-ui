<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<title>Clash of Armored</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#05070a;color:#fff;
  font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}

/* ====== SPLASH ====== */
#splash{position:fixed;inset:0;z-index:9999;background:#05070a;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .6s}
#splash.hide{opacity:0;pointer-events:none}
#splash::before{content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 50% 40%,rgba(255,123,0,.18),transparent 55%),
             radial-gradient(circle at 50% 80%,rgba(0,229,255,.12),transparent 60%)}
.splash-logo{position:relative;z-index:2;font-family:Impact,'Arial Black',sans-serif;
  font-size:clamp(32px,10vw,64px);letter-spacing:4px;text-align:center;line-height:1;
  background:linear-gradient(180deg,#fff 0%,#ffb347 45%,#ff7b00 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 14px rgba(255,123,0,.9));opacity:0;
  animation:logoIn 1.2s ease-out .2s forwards}
@keyframes logoIn{from{opacity:0;transform:translateY(30px) scale(.7)}
  to{opacity:1;transform:translateY(0) scale(1)}}
.splash-tag{position:relative;z-index:2;margin-top:8px;font-size:11px;
  letter-spacing:8px;color:#00e5ff;text-shadow:0 0 10px #00e5ff;opacity:0;
  animation:fin .8s ease 1.4s forwards}
@keyframes fin{to{opacity:1}}
.loader{position:relative;z-index:2;width:min(78%,360px);margin-top:44px;opacity:0;
  animation:fin .6s ease 1.6s forwards}
.bar{width:100%;height:10px;background:rgba(0,0,0,.6);border:2px solid rgba(255,123,0,.4);
  border-radius:12px;overflow:hidden}
.fill{height:100%;width:0%;background:linear-gradient(90deg,#ff7b00,#ffb347,#00e5ff);
  border-radius:10px;transition:width .15s linear;
  box-shadow:0 0 12px #ff7b00,0 0 22px #ffb347}
.bar-text{display:flex;justify-content:space-between;margin-top:10px;font-size:12px;color:#fff}

/* ====== AUTH ====== */
#auth{position:fixed;inset:0;z-index:8000;display:none;flex-direction:column;
  align-items:center;justify-content:center;padding:20px;overflow-y:auto;
  background:radial-gradient(circle at 50% 30%,rgba(255,123,0,.15),transparent 55%),#05070a}
#auth.show{display:flex}
.auth-logo{font-family:Impact,'Arial Black',sans-serif;font-size:clamp(26px,8vw,42px);
  letter-spacing:4px;text-align:center;line-height:1.1;
  background:linear-gradient(180deg,#fff 0%,#ffb347 50%,#ff7b00 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 15px rgba(255,123,0,.8));margin-bottom:6px}
.auth-tag{font-size:11px;letter-spacing:8px;color:#00e5ff;text-shadow:0 0 10px #00e5ff;
  margin-bottom:30px}
.card{width:100%;max-width:380px;background:linear-gradient(180deg,rgba(22,28,36,.98),rgba(13,18,24,.98));
  border:1px solid rgba(255,179,71,.35);border-radius:20px;padding:24px 20px;
  box-shadow:0 20px 60px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.15)}
.card-title{font-size:17px;text-align:center;margin-bottom:20px;letter-spacing:2px;
  font-weight:700;color:#fff;text-shadow:0 0 10px rgba(255,179,71,.5)}
.inp-group{margin-bottom:12px}
.inp-group label{display:block;font-size:11px;color:#ffb347;margin-bottom:6px;
  letter-spacing:1px;padding-right:4px}
.inp{width:100%;padding:14px 16px;font-size:15px;color:#fff;background:rgba(0,0,0,.5);
  border:2px solid rgba(255,179,71,.25);border-radius:12px;outline:none;
  font-family:inherit;direction:ltr;text-align:left;transition:.2s}
.inp:focus{border-color:#ff7b00;box-shadow:0 0 15px rgba(255,123,0,.4)}
.inp::placeholder{color:rgba(255,255,255,.25)}
.btn{width:100%;padding:15px;font-size:14px;font-weight:800;letter-spacing:2px;
  border-radius:12px;cursor:pointer;border:none;font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .08s,box-shadow .08s}
.btn-primary{background:linear-gradient(180deg,#ffb347,#ff7b00 50%,#cc5f00);color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.6);
  box-shadow:0 4px 0 #7a3a00,0 8px 20px rgba(255,123,0,.5),inset 0 1px 0 rgba(255,255,255,.4)}
.btn-primary:active{transform:translateY(3px);box-shadow:0 1px 0 #7a3a00,0 3px 10px rgba(255,123,0,.4)}
.btn-google{background:#fff;color:#1a1a1a;margin-top:10px;box-shadow:0 4px 0 #999}
.btn-google:active{transform:translateY(3px);box-shadow:0 1px 0 #999}
.btn-guest{background:rgba(0,229,255,.1);color:#00e5ff;
  border:2px solid rgba(0,229,255,.4);margin-top:10px}
.btn-guest:active{transform:translateY(3px);background:rgba(0,229,255,.2)}
.divider{display:flex;align-items:center;gap:12px;margin:18px 0;font-size:11px;
  color:rgba(255,255,255,.35);letter-spacing:3px}
.divider::before,.divider::after{content:'';flex:1;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,179,71,.4),transparent)}
.err{background:rgba(220,38,38,.15);border:1px solid rgba(220,38,38,.5);color:#ff6b6b;
  padding:10px;border-radius:10px;font-size:12px;margin-bottom:12px;display:none;text-align:center}
.err.show{display:block}
.switch{text-align:center;margin-top:16px;font-size:12px;color:rgba(255,255,255,.5)}
.switch a{color:#ffb347;cursor:pointer;font-weight:700;text-decoration:none}
.avatars{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0 18px}
.av{aspect-ratio:1;border-radius:50%;background:rgba(255,179,71,.1);
  border:2px solid rgba(255,179,71,.3);color:#ffb347;font-size:18px;font-weight:900;
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.av.sel{background:linear-gradient(135deg,#ff7b00,#ffb347);color:#fff;
  border-color:#fff;box-shadow:0 0 15px #ff7b00;transform:scale(1.1)}

/* ====== LOBBY ====== */
#lobby{position:fixed;inset:0;display:none;flex-direction:column;
  background:linear-gradient(180deg,#0a0d12 0%,#0d1218 60%,#05070a 100%);overflow:hidden}
#lobby.show{display:flex}
.bg{position:absolute;inset:0;z-index:0;overflow:hidden}
.bg::before{content:'';position:absolute;inset:-30%;
  background:radial-gradient(circle at 20% 30%,rgba(255,123,0,.18),transparent 45%),
             radial-gradient(circle at 80% 70%,rgba(0,229,255,.12),transparent 50%),
             radial-gradient(circle at 50% 90%,rgba(255,123,0,.22),transparent 60%);
  animation:bgShift 12s ease-in-out infinite alternate}
@keyframes bgShift{to{transform:translate(-4%,3%) scale(1.08)}}
.parts{position:absolute;inset:0;z-index:1;pointer-events:none}
.p{position:absolute;bottom:-20px;border-radius:50%;opacity:0;animation:rise linear infinite}
.p.fire{background:radial-gradient(circle,#ffb347 0%,#ff7b00 40%,transparent 70%);
  box-shadow:0 0 12px #ff7b00}
.p.smoke{background:radial-gradient(circle,rgba(80,80,80,.5) 0%,transparent 70%)}
@keyframes rise{0%{transform:translateY(0) translateX(0);opacity:0}
  15%{opacity:1}100%{transform:translateY(-110vh) translateX(var(--d,0));opacity:0}}

.hud{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;
  gap:8px;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.pcard{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;
  background:rgba(20,25,30,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,179,71,.35);border-radius:40px;
  box-shadow:0 4px 20px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.15);cursor:pointer}
.pav{width:42px;height:42px;border-radius:50%;
  background:linear-gradient(135deg,#ff7b00,#ffb347);display:flex;align-items:center;
  justify-content:center;font-size:20px;font-weight:900;color:#fff;
  border:2px solid rgba(255,255,255,.3);box-shadow:0 0 12px rgba(255,123,0,.7)}
.pinfo{display:flex;flex-direction:column;min-width:0}
.pname{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:120px;text-shadow:0 0 6px rgba(255,179,71,.5)}
.lvl{display:flex;align-items:center;gap:6px;margin-top:3px}
.lvlb{font-size:10px;font-weight:900;background:linear-gradient(135deg,#ff7b00,#ffb347);
  color:#000;padding:2px 8px;border-radius:8px;letter-spacing:1px}
.xp{width:60px;height:5px;background:rgba(0,0,0,.6);border-radius:4px;overflow:hidden;
  border:1px solid rgba(255,179,71,.3)}
.xpf{height:100%;width:0%;background:linear-gradient(90deg,#00e5ff,#7dff56);
  box-shadow:0 0 8px #00e5ff;transition:width .3s}
.cur-g{display:flex;gap:6px}
.cur{display:flex;align-items:center;gap:5px;padding:6px 12px;
  background:rgba(20,25,30,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,179,71,.35);border-radius:30px;font-size:12px;font-weight:700;
  box-shadow:0 4px 16px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.15)}
.cur.gold{color:#ffd54f}.cur.gems{color:#00e5ff}
.icon-top{width:42px;height:42px;border-radius:50%;
  background:rgba(20,25,30,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,179,71,.35);color:#fff;font-size:20px;display:flex;
  align-items:center;justify-content:center;cursor:pointer}
.icon-top:active{transform:scale(.9)}

.stage{position:relative;z-index:5;flex:1;display:flex;align-items:center;
  justify-content:center;padding:10px}
.tank{width:200px;height:250px;animation:tankF 3.5s ease-in-out infinite;
  filter:drop-shadow(0 20px 30px rgba(0,0,0,.7)) drop-shadow(0 0 30px rgba(255,123,0,.5))}
@keyframes tankF{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.tank svg{width:100%;height:100%}
.ring{position:absolute;bottom:10%;left:50%;transform:translateX(-50%);
  width:160px;height:160px;border-radius:50%;
  border:2px dashed rgba(255,123,0,.4);animation:ringR 12s linear infinite}
@keyframes ringR{from{transform:translateX(-50%) rotate(0)}to{transform:translateX(-50%) rotate(360deg)}}

.sides{position:absolute;right:12px;top:50%;transform:translateY(-50%);z-index:10;
  display:flex;flex-direction:column;gap:10px}
.sicon{width:52px;height:52px;border-radius:14px;
  background:rgba(20,25,30,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,179,71,.35);color:#fff;font-size:22px;display:flex;
  align-items:center;justify-content:center;cursor:pointer;position:relative;
  box-shadow:0 6px 20px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.15)}
.sicon:active{transform:scale(.88)}
.sicon .bdg{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;
  border-radius:10px;background:linear-gradient(135deg,#ff3b30,#ff7b00);color:#fff;
  font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;
  padding:0 5px;box-shadow:0 0 10px #ff3b30;border:1px solid #fff}

.bottom{position:relative;z-index:10;padding:10px 14px;
  padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:12px}
.btn-play{position:relative;width:100%;max-width:420px;margin:0 auto;
  padding:18px 24px;font-family:Impact,'Arial Black',sans-serif;font-size:22px;
  letter-spacing:4px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.8);
  background:linear-gradient(180deg,#ffb347,#ff7b00 50%,#cc5f00);
  border:2px solid #ffd8a8;border-radius:16px;cursor:pointer;
  box-shadow:0 6px 0 #7a3a00,0 10px 25px rgba(255,123,0,.55),
    inset 0 2px 0 rgba(255,255,255,.5),inset 0 -4px 8px rgba(0,0,0,.4)}
.btn-play:active{transform:translateY(4px);box-shadow:0 2px 0 #7a3a00,0 4px 12px rgba(255,123,0,.5)}
.btn-row{display:flex;gap:8px;justify-content:center;max-width:420px;margin:0 auto;width:100%}
.btn-sec{flex:1;padding:12px 6px;font-size:11px;font-weight:700;letter-spacing:1px;
  color:#fff;background:rgba(20,25,30,.6);backdrop-filter:blur(14px);
  border:1px solid rgba(255,179,71,.35);border-radius:14px;cursor:pointer;
  box-shadow:0 4px 0 rgba(0,0,0,.6),0 8px 20px rgba(0,0,0,.5);
  display:flex;flex-direction:column;align-items:center;gap:4px}
.btn-sec:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.6)}
.btn-sec .ic{font-size:20px}
.btn-sec.orange{color:#ffb347}.btn-sec.cyan{color:#00e5ff}
.btn-sec.green{color:#7dff56}.btn-sec.red{color:#ff4444}

/* ====== MODAL ====== */
.ov{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.75);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;
  align-items:center;justify-content:center;padding:20px}
.ov.show{display:flex}
.box{width:100%;max-width:420px;background:linear-gradient(180deg,rgba(22,28,36,.98),rgba(13,18,24,.98));
  border:1px solid rgba(255,179,71,.35);border-radius:20px;padding:24px 20px;
  box-shadow:0 20px 60px rgba(0,0,0,.9);max-height:85vh;overflow-y:auto}
.box-t{font-family:Impact,sans-serif;font-size:22px;letter-spacing:3px;color:#ff7b00;
  text-shadow:0 0 10px rgba(255,123,0,.7);text-align:center;margin-bottom:18px}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;
  border-bottom:1px solid rgba(255,255,255,.06);font-size:14px}
.row:last-child{border-bottom:none}
.box-close{width:100%;margin-top:16px;padding:14px;font-size:14px;font-weight:700;
  letter-spacing:2px;color:#fff;background:linear-gradient(180deg,#ff7b00,#cc5f00);
  border:1px solid #ffb347;border-radius:12px;cursor:pointer;
  box-shadow:0 4px 0 #7a3a00}
.box-close:active{transform:translateY(3px);box-shadow:0 1px 0 #7a3a00}

/* ====== TOAST ====== */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(80px);
  background:linear-gradient(180deg,rgba(22,28,36,.98),rgba(13,18,24,.98));
  border:1px solid rgba(255,179,71,.35);border-radius:12px;padding:12px 20px;
  font-size:13px;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.7);opacity:0;
  transition:all .35s;z-index:500;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="splash-logo">CLASH OF<br>ARMORED</div>
  <div class="splash-tag">CLASH OF ARMORED</div>
  <div class="loader">
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="bar-text"><span>جاري التحميل...</span><span id="pct">0%</span></div>
  </div>
</div>

<!-- AUTH -->
<div id="auth">
  <div class="auth-logo">CLASH OF<br>ARMORED</div>
  <div class="auth-tag">SURVIVE • FIGHT • WIN</div>
  <div class="card" id="authCard"></div>
</div>

<!-- LOBBY -->
<div id="lobby">
  <div class="bg"><div class="parts" id="parts"></div></div>

  <div class="hud">
    <div class="pcard" data-act="profile">
      <div class="pav" id="pav">C</div>
      <div class="pinfo">
        <div class="pname" id="pname">Commander</div>
        <div class="lvl">
          <span class="lvlb">LV <span id="plvl">1</span></span>
          <div class="xp"><div class="xpf" id="pxp"></div></div>
        </div>
      </div>
    </div>
    <div class="cur-g">
      <div class="cur gold">🪙<span id="pgold">1500</span></div>
      <div class="cur gems">💎<span id="pgems">25</span></div>
    </div>
    <button class="icon-top" data-act="settings">⚙</button>
  </div>

  <div class="stage">
    <div class="ring"></div>
    <div class="tank">
      <svg viewBox="0 0 120 150" xmlns="http://www.w3.org/2000/svg">
        <rect x="10" y="10" width="14" height="130" fill="#1a1a1a" rx="4"/>
        <rect x="96" y="10" width="14" height="130" fill="#1a1a1a" rx="4"/>
        <g fill="#2a2a2a">
          <rect x="10" y="20" width="14" height="4"/><rect x="10" y="40" width="14" height="4"/>
          <rect x="10" y="60" width="14" height="4"/><rect x="10" y="80" width="14" height="4"/>
          <rect x="10" y="100" width="14" height="4"/><rect x="10" y="120" width="14" height="4"/>
          <rect x="96" y="20" width="14" height="4"/><rect x="96" y="40" width="14" height="4"/>
          <rect x="96" y="60" width="14" height="4"/><rect x="96" y="80" width="14" height="4"/>
          <rect x="96" y="100" width="14" height="4"/><rect x="96" y="120" width="14" height="4"/>
        </g>
        <rect x="24" y="15" width="72" height="120" rx="8" fill="url(#bg1)" stroke="#0d0d0d" stroke-width="2"/>
        <rect x="30" y="25" width="60" height="6" fill="#3d4a2b" opacity=".7" rx="2"/>
        <rect x="30" y="120" width="60" height="6" fill="#3d4a2b" opacity=".7" rx="2"/>
        <circle cx="60" cy="75" r="22" fill="url(#tg1)" stroke="#0d0d0d" stroke-width="2"/>
        <circle cx="60" cy="75" r="12" fill="#1a1a1a"/>
        <circle cx="60" cy="75" r="6" fill="#0d0d0d"/>
        <rect x="55" y="20" width="10" height="55" rx="3" fill="#1a1a1a"/>
        <rect x="57" y="18" width="6" height="8" fill="#3d4a2b"/>
        <polygon points="60,55 62,62 69,62 63,67 65,74 60,69 55,74 57,67 51,62 58,62" fill="#ff7b00" opacity=".85"/>
        <defs>
          <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#7d9556"/><stop offset="50%" stop-color="#5a6e3d"/>
            <stop offset="100%" stop-color="#3d4a2b"/>
          </linearGradient>
          <radialGradient id="tg1" cx=".35" cy=".35" r=".7">
            <stop offset="0%" stop-color="#8ba862"/><stop offset="60%" stop-color="#5a6e3d"/>
            <stop offset="100%" stop-color="#2a3420"/>
          </radialGradient>
        </defs>
      </svg>
    </div>
  </div>

  <div class="sides">
    <button class="sicon" data-act="shop">🛒</button>
    <button class="sicon" data-act="daily">🎁<span class="bdg" id="bdg">1</span></button>
    <button class="sicon" data-act="maps">🗺</button>
    <button class="sicon" data-act="inventory">🎒</button>
    <button class="sicon" data-act="achievements">🏆</button>
  </div>

  <div class="bottom">
    <button class="btn-play" id="btnPlay">⚔ ابدأ المعركة</button>
    <div class="btn-row">
      <button class="btn-sec orange" data-act="shop"><span class="ic">🛒</span><span>المتجر</span></button>
      <button class="btn-sec cyan" data-act="daily"><span class="ic">🎁</span><span>اليومي</span></button>
      <button class="btn-sec green" data-act="maps"><span class="ic">🗺</span><span>الخرائط</span></button>
      <button class="btn-sec red" data-act="settings"><span class="ic">⚙</span><span>إعدادات</span></button>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="ov" id="ov">
  <div class="box">
    <div class="box-t" id="boxT">عنوان</div>
    <div id="boxB"></div>
    <button class="box-close" onclick="closeModal()">إغلاق</button>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };

/* ========= CACHE ========= */
var C = {
  set:function(k,v){ try{ localStorage.setItem('coa_'+k, JSON.stringify(v)); }catch(e){} },
  get:function(k,d){ try{ var r=localStorage.getItem('coa_'+k); return r?JSON.parse(r):d; }catch(e){ return d; } },
  del:function(k){ localStorage.removeItem('coa_'+k); }
};

/* ========= AUDIO ========= */
var AC = null;
function tone(freq, dur, type, vol){
  try {
    if(!AC){ var A=window.AudioContext||window.webkitAudioContext; if(!A)return; AC=new A(); }
    if(AC.state==='suspended') AC.resume();
    var o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'square'; o.frequency.value=freq;
    g.gain.setValueAtTime(vol||0.12, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+(dur||0.08));
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+(dur||0.08));
  } catch(e){}
}
var Sound = {
  click: function(){ tone(800, .05, 'square', .12); },
  success: function(){ tone(600, .08, 'triangle', .15); setTimeout(function(){ tone(900, .12, 'triangle', .15); }, 80); },
  error: function(){ tone(220, .15, 'sawtooth', .12); },
  coin: function(){ tone(1200, .06, 'square', .12); setTimeout(function(){ tone(1600, .08, 'square', .12); }, 60); }
};

/* ========= PROFILE ========= */
function getProfile(){ return C.get('profile', null); }
function saveProfile(p){ C.set('profile', p); }
function createProfile(name, avatar, method){
  var p = {
    id: 'p_'+Date.now(),
    username: name,
    avatar: avatar || 'C',
    method: method || 'guest',
    level: 1, xp: 0, xpMax: 1000,
    gold: 1500, gems: 25,
    wins: 0, kills: 0, matches: 0,
    createdAt: Date.now()
  };
  saveProfile(p);
  return p;
}

/* ========= TOAST ========= */
var toastT = null;
function toast(msg, dur){
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(function(){ t.classList.remove('show'); }, dur || 2200);
}
window.toast = toast;

/* ========= MODAL ========= */
function openModal(title, html){
  $('boxT').textContent = title;
  $('boxB').innerHTML = html;
  $('ov').classList.add('show');
}
function closeModal(){ $('ov').classList.remove('show'); }
window.closeModal = closeModal;
$('ov').onclick = function(e){ if(e.target === this) closeModal(); };

/* ========= SPLASH ========= */
function runSplash(){
  var fill = $('fill'), pct = $('pct');
  var prog = 0;
  var t = setInterval(function(){
    prog += Math.random()*10 + 4;
    if(prog >= 100){
      prog = 100;
      clearInterval(t);
      setTimeout(function(){
        $('splash').classList.add('hide');
        afterSplash();
      }, 400);
    }
    fill.style.width = prog + '%';
    pct.textContent = Math.floor(prog) + '%';
  }, 100);
}

function afterSplash(){
  var p = getProfile();
  if(p && p.id){ startLobby(p); }
  else { showAuth(); }
}

/* ========= AUTH UI ========= */
var selectedAvatar = 'C';

function showAuth(){
  var card = $('authCard');
  card.innerHTML = ''
    + '<div class="card-title">👤 تسجيل الدخول</div>'
    + '<div class="err" id="err"></div>'
    + '<div class="inp-group"><label>اسم المستخدم</label>'
    + '<input type="text" class="inp" id="inUser" placeholder="Commander" maxlength="20"></div>'
    + '<button class="btn btn-primary" id="btnLogin">▶ متابعة</button>'
    + '<div class="divider">أو</div>'
    + '<button class="btn btn-google" id="btnGoogle"><b style="color:#4285F4;font-size:18px;">G</b> الدخول بحساب Google</button>'
    + '<button class="btn btn-guest" id="btnGuest">🎮 الدخول كزائر</button>'
    + '<div class="switch">ليس لديك حساب؟ <a id="goReg">أنشئ حساباً</a></div>';

  $('auth').classList.add('show');
  $('btnLogin').onclick = doLogin;
  $('btnGoogle').onclick = doGoogle;
  $('btnGuest').onclick = doGuest;
  $('goReg').onclick = showRegister;
}

function showRegister(){
  var avs = ['A','B','C','D','E','F','G','H','J','K','L','M'];
  var avHTML = avs.map(function(a,i){
    return '<div class="av'+(i===2?' sel':'')+'" data-av="'+a+'">'+a+'</div>';
  }).join('');

  var card = $('authCard');
  card.innerHTML = ''
    + '<div class="card-title">✚ حساب جديد</div>'
    + '<div class="err" id="err"></div>'
    + '<div class="inp-group"><label>اسم المستخدم</label>'
    + '<input type="text" class="inp" id="regUser" placeholder="Commander" maxlength="20"></div>'
    + '<div style="font-size:11px;color:#ffb347;margin-bottom:6px;padding-right:4px;">اختر صورة رمزية</div>'
    + '<div class="avatars" id="avs">'+avHTML+'</div>'
    + '<button class="btn btn-primary" id="btnReg">✚ إنشاء الحساب</button>'
    + '<div class="switch">لديك حساب؟ <a id="goLogin">تسجيل الدخول</a></div>';

  $('auth').classList.add('show');
  selectedAvatar = 'C';

  var avEls = document.querySelectorAll('#avs .av');
  avEls.forEach(function(el){
    el.onclick = function(){
      avEls.forEach(function(x){ x.classList.remove('sel'); });
      el.classList.add('sel');
      selectedAvatar = el.getAttribute('data-av');
      Sound.click();
    };
  });

  $('btnReg').onclick = doRegister;
  $('goLogin').onclick = showAuth;
}

function showErr(msg){
  var e = $('err');
  if(e){ e.textContent = msg; e.classList.add('show'); }
  Sound.error();
}

function doRegister(){
  var name = ($('regUser').value || '').trim();
  if(name.length < 2) return showErr('الاسم قصير جداً');
  var p = createProfile(name, selectedAvatar, 'email');
  Sound.success();
  startLobby(p);
}

function doLogin(){
  var name = ($('inUser').value || '').trim();
  var p = getProfile();
  if(p && name.length >= 2){
    p.username = name;
    saveProfile(p);
  }
  if(!p){ showRegister(); return; }
  Sound.success();
  startLobby(p);
}

function doGoogle(){
  var p = getProfile();
  if(!p){
    p = createProfile('GoogleUser'+Math.floor(Math.random()*9000+1000), 'G', 'google');
  }
  Sound.success();
  startLobby(p);
}

function doGuest(){
  var p = getProfile();
  if(!p){
    p = createProfile('Guest'+Math.floor(Math.random()*9000+1000), '★', 'guest');
  }
  Sound.success();
  startLobby(p);
}

/* ========= LOBBY ========= */
var cur = null;
function startLobby(p){
  cur = p;
  $('auth').classList.remove('show');
  $('lobby').classList.add('show');
  updateHUD(p);
  spawnParts();
  bindLobby();
}

function updateHUD(p){
  if(!p) return;
  $('pname').textContent = p.username;
  $('pav').textContent = p.avatar || 'C';
  $('plvl').textContent = p.level;
  $('pxp').style.width = ((p.xp / p.xpMax) * 100) + '%';
  $('pgold').textContent = p.gold.toLocaleString();
  $('pgems').textContent = p.gems;
}

function spawnParts(){
  var box = $('parts');
  if(box.dataset.on) return;
  box.dataset.on = '1';

  function make(kind){
    var d = document.createElement('div');
    d.className = 'p ' + kind;
    var sz = kind === 'fire' ? 8 + Math.random()*14 : 20 + Math.random()*30;
    d.style.width = sz + 'px';
    d.style.height = sz + 'px';
    d.style.left = Math.random()*100 + '%';
    d.style.setProperty('--d', (Math.random()*200 - 100) + 'px');
    var dur = kind === 'fire' ? 3 + Math.random()*2.5 : 6 + Math.random()*4;
    d.style.animationDuration = dur + 's';
    d.style.animationDelay = (Math.random()*4) + 's';
    box.appendChild(d);
    setTimeout(function(){ d.remove(); }, (dur+4)*1000);
  }

  for(var i=0;i<10;i++) make('fire');
  for(var j=0;j<5;j++) make('smoke');

  setInterval(function(){
    make('fire');
    if(Math.random() > 0.5) make('smoke');
  }, 1000);
}

function bindLobby(){
  var play = $('btnPlay');
  if(play){
    play.onclick = function(){
      Sound.click();
      toast('⚔ جاري تحميل المعركة...');
      setTimeout(function(){ window.location.href = 'game/index.html'; }, 600);
    };
  }

  document.querySelectorAll('[data-act]').forEach(function(el){
    el.onclick = function(){
      var a = el.getAttribute('data-act');
      Sound.click();
      handleAct(a);
    };
  });
}

function handleAct(a){
  if(a === 'settings') return openModal('الإعدادات', '<div class="row"><span>🔊 الصوت</span><span>70%</span></div><div class="row"><span>🎮 الحساسية</span><span>5</span></div>');
  if(a === 'shop') return openModal('المتجر', '<div class="row"><span>💎 100 جوهرة</span><span style="color:#ffd54f;">1000 🪙</span></div><div class="row"><span>🛡 ترقية</span><span style="color:#ffd54f;">500 🪙</span></div>');
  if(a === 'maps') return openModal('الخرائط', '<div class="row"><span>🗺 ساحة التدريب</span><span style="color:#7dff56;">✓</span></div><div class="row"><span>🏭 مصنع</span><span style="color:#9a9a9a;">🔒</span></div>');
  if(a === 'achievements') return openModal('الإنجازات', '<div class="row"><span>🎯 أول فوز</span><span style="color:#7dff56;">✓</span></div><div class="row"><span>💀 10 قتلات</span><span>3/10</span></div>');
  if(a === 'inventory') return openModal('الحقيبة', '<div class="row"><span>🔫 مدفع</span><span style="color:#00e5ff;">مفعّل</span></div><div class="row"><span>🛡 درع</span><span style="color:#00e5ff;">مفعّل</span></div>');
  if(a === 'daily'){
    cur.gold += 200;
    cur.gems += 5;
    saveProfile(cur);
    updateHUD(cur);
    Sound.coin();
    var b = $('bdg'); if(b) b.style.display = 'none';
    return toast('🎁 استلمت 200 ذهب + 5 جواهر!');
  }
  if(a === 'profile'){
    var rate = cur.matches ? Math.round((cur.wins/cur.matches)*100) : 0;
    return openModal('الملف الشخصي',
      '<div style="text-align:center;margin-bottom:14px;">'
      + '<div style="width:70px;height:70px;border-radius:50%;margin:0 auto 10px;background:linear-gradient(135deg,#ff7b00,#ffb347);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;border:3px solid #fff;">'+(cur.avatar||'C')+'</div>'
      + '<div style="font-size:17px;font-weight:900;">'+cur.username+'</div>'
      + '</div>'
      + '<div class="row"><span>🏆 المستوى</span><span style="color:#ffb347;">'+cur.level+'</span></div>'
      + '<div class="row"><span>🎯 المباريات</span><span>'+cur.matches+'</span></div>'
      + '<div class="row"><span>🥇 الانتصارات</span><span style="color:#7dff56;">'+cur.wins+'</span></div>'
      + '<div class="row"><span>💀 القتلات</span><span style="color:#ff4444;">'+cur.kills+'</span></div>'
      + '<div class="row"><span>📊 نسبة الفوز</span><span>'+rate+'%</span></div>'
      + '<button class="box-close" style="background:linear-gradient(180deg,#dc2626,#991b1b);" onclick="logout()">🚪 تسجيل الخروج</button>'
    );
  }
  toast('🚧 قيد التطوير');
}

function logout(){
  C.del('profile');
  closeModal();
  $('lobby').classList.remove('show');
  showAuth();
}
window.logout = logout;

/* ========= BOOT ========= */
window.addEventListener('DOMContentLoaded', function(){
  setTimeout(runSplash, 100);
});

})();
</script>
</body>
</html>
