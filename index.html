<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05070a">
  <title>Clash of Armored</title>
  <link rel="stylesheet" href="styles/colors.css">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/buttons.css">
  <link rel="stylesheet" href="styles/modern.css">
  <link rel="stylesheet" href="styles/auth.css">
</head>
<body>

  <!-- ============ SPLASH ============ -->
  <div id="splash">
    <div class="splash-logo">CLASH OF<br>ARMORED</div>
    <div class="splash-subtitle">CLASH OF ARMORED</div>
    <div class="loading-container">
      <div class="loading-bar"><div class="loading-fill" id="loadingFill"></div></div>
      <div class="loading-text">
        <span>جاري التحميل</span>
        <span id="loadingPercent">0%</span>
      </div>
    </div>
    <div class="loading-tip" id="loadingTip">جاري تجهيز المدرعة...</div>
  </div>

  <!-- ============ AUTH SCREEN ============ -->
  <div id="authScreen">
    <div id="authContent" style="width:100%;display:flex;flex-direction:column;align-items:center;"></div>
  </div>

  <!-- ============ LOBBY ============ -->
  <div id="lobby">
    <div class="lobby-bg"><div class="particles" id="particles"></div></div>

    <!-- Top HUD -->
    <div class="top-hud">
      <div class="player-card" data-action="profile" style="cursor:pointer;">
        <div class="avatar" id="playerAvatar">C</div>
        <div class="player-info">
          <div class="player-name" id="playerName">Commander</div>
          <div class="level-bar">
            <span class="level-badge">LV <span id="playerLevel">1</span></span>
            <div class="xp-bar"><div class="xp-fill" id="playerXp"></div></div>
          </div>
        </div>
      </div>

      <div class="currency-group">
        <div class="currency gold"><span class="currency-icon">🪙</span><span id="playerGold">1,500</span></div>
        <div class="currency gems"><span class="currency-icon">💎</span><span id="playerGems">25</span></div>
      </div>

      <button class="icon-btn-top" data-action="settings">⚙</button>
    </div>

    <!-- Center tank -->
    <div class="center-stage">
      <div class="stage-ring"></div>
      <div class="tank-showcase">
        <svg viewBox="0 0 120 150" xmlns="http://www.w3.org/2000/svg">
          <rect x="10" y="10" width="14" height="130" fill="#1a1a1a" rx="4"/>
          <rect x="96" y="10" width="14" height="130" fill="#1a1a1a" rx="4"/>
          <g fill="#2a2a2a">
            <rect x="10" y="20" width="14" height="4"/><rect x="10" y="40" width="14" height="4"/>
            <rect x="10" y="60" width="14" height="4"/><rect x="10" y="80" width="14" height="4"/>
            <rect x="10" y="100" width="14" height="4"/><rect x="10" y="120" width="14" height="4"/>
            <rect x="96" y="20" width="14" height="4"/><rect x="96" y="40" width="14" height="4"/>
            <rect x="96" y="60" width="14" height="4"/><rect x="96" y="80" width="14" height="4"/>
            <rect x="96" y="100" width="14" height="4"/><rect x="96" y="120" width="14" height="4"/>
          </g>
          <rect x="24" y="15" width="72" height="120" rx="8" fill="url(#bodyGrad)" stroke="#0d0d0d" stroke-width="2"/>
          <rect x="30" y="25" width="60" height="6" fill="#3d4a2b" opacity="0.7" rx="2"/>
          <rect x="30" y="120" width="60" height="6" fill="#3d4a2b" opacity="0.7" rx="2"/>
          <circle cx="60" cy="75" r="22" fill="url(#turretGrad)" stroke="#0d0d0d" stroke-width="2"/>
          <circle cx="60" cy="75" r="12" fill="#1a1a1a"/>
          <circle cx="60" cy="75" r="6" fill="#0d0d0d"/>
          <rect x="55" y="20" width="10" height="55" rx="3" fill="#1a1a1a" stroke="#000"/>
          <rect x="57" y="18" width="6" height="8" fill="#3d4a2b"/>
          <polygon points="60,55 62,62 69,62 63,67 65,74 60,69 55,74 57,67 51,62 58,62" fill="#ff7b00" opacity="0.85"/>
          <defs>
            <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#7d9556"/><stop offset="50%" stop-color="#5a6e3d"/><stop offset="100%" stop-color="#3d4a2b"/>
            </linearGradient>
            <radialGradient id="turretGrad" cx="0.35" cy="0.35" r="0.7">
              <stop offset="0%" stop-color="#8ba862"/><stop offset="60%" stop-color="#5a6e3d"/><stop offset="100%" stop-color="#2a3420"/>
            </radialGradient>
          </defs>
        </svg>
      </div>
    </div>

    <!-- Side icons -->
    <div class="side-icons">
      <button class="side-icon" data-action="shop">🛒</button>
      <button class="side-icon" data-action="daily">🎁<span class="badge" id="dailyBadge">1</span></button>
      <button class="side-icon" data-action="maps">🗺</button>
      <button class="side-icon" data-action="inventory">🎒</button>
      <button class="side-icon" data-action="achievements">🏆</button>
    </div>

    <!-- Bottom buttons -->
    <div class="bottom-actions">
      <button class="btn-play" id="btnPlay">⚔ ابدأ المعركة</button>
      <div class="btn-row">
        <button class="btn-secondary orange" data-action="shop"><span class="icon">🛒</span><span>المتجر</span></button>
        <button class="btn-secondary cyan"   data-action="daily"><span class="icon">🎁</span><span>اليومي</span></button>
        <button class="btn-secondary green"  data-action="maps"><span class="icon">🗺</span><span>الخرائط</span></button>
        <button class="btn-secondary red"    data-action="settings"><span class="icon">⚙</span><span>إعدادات</span></button>
      </div>
    </div>
  </div>

  <!-- ============ MODAL ============ -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <div class="modal-title" id="modalTitle">عنوان</div>
      <div class="modal-body" id="modalBody"></div>
      <button class="modal-close" id="modalClose">إغلاق</button>
    </div>
  </div>

  <!-- ============ TOAST ============ -->
  <div class="toast" id="toast"></div>

  <!-- ============ SCRIPTS ============ -->
  <script src="../clash-cache/src/cache.js"></script>
  <script src="../clash-cache/src/save-system.js"></script>
  <script src="../clash-cache/src/profile-manager.js"></script>
  <script>
    window.COA = {
      cache: new CoaCache(),
      saves: new SaveSystem(new CoaCache())
    };
  </script>
  <script src="scripts/audio-manager.js"></script>
  <script src="scripts/auth.js"></script>
  <script src="scripts/app.js"></script>
</body>
</html>
