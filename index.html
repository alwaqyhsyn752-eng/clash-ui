<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05070a">
  <title>Clash of Armored</title>
  <link rel="stylesheet" href="styles/colors.css">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/buttons.css">
  <link rel="stylesheet" href="styles/modern.css">
</head>
<body>

  <!-- ============================================
       SPLASH SCREEN
       ============================================ -->
  <div id="splash">
    <div class="splash-logo">CLASH OF<br>ARMORED</div>
    <div class="splash-subtitle">CLASH OF ARMORED</div>

    <div class="loading-container">
      <div class="loading-bar">
        <div class="loading-fill" id="loadingFill"></div>
      </div>
      <div class="loading-text">
        <span>جاري التحميل</span>
        <span id="loadingPercent">0%</span>
      </div>
    </div>

    <div class="loading-tip" id="loadingTip">جاري تجهيز المدرعة...</div>
  </div>

  <!-- ============================================
       LOBBY
       ============================================ -->
  <div id="lobby">

    <!-- الخلفية المتحركة -->
    <div class="lobby-bg">
      <div class="particles" id="particles"></div>
    </div>

    <!-- ===== الشريط العلوي (بيانات اللاعب) ===== -->
    <div class="top-hud">
      <div class="player-card">
        <div class="avatar">C</div>
        <div class="player-info">
          <div class="player-name" id="playerName">Commander</div>
          <div class="level-bar">
            <span class="level-badge">LV <span id="playerLevel">1</span></span>
            <div class="xp-bar"><div class="xp-fill" id="playerXp"></div></div>
          </div>
        </div>
      </div>

      <div class="currency-group">
        <div class="currency gold">
          <span class="currency-icon">🪙</span>
          <span id="playerGold">1,500</span>
        </div>
        <div class="currency gems">
          <span class="currency-icon">💎</span>
          <span id="playerGems">25</span>
        </div>
      </div>

      <button class="icon-btn-top" data-action="settings" aria-label="الإعدادات">⚙</button>
    </div>

    <!-- ===== منتصف الشاشة (المدرعة) ===== -->
    <div class="center-stage">
      <div class="stage-ring"></div>

      <div class="tank-showcase">
        <!-- مدرعة SVG -->
        <svg viewBox="0 0 120 150" xmlns="http://www.w3.org/2000/svg">
          <!-- الجنازير -->
          <rect x="10" y="10" width="14" height="130" fill="#1a1a1a" rx="4"/>
          <rect x="96" y="10" width="14" height="130" fill="#1a1a1a" rx="4"/>

          <!-- خطوط الجنازير -->
          <g fill="#2a2a2a">
            <rect x="10" y="20" width="14" height="4"/>
            <rect x="10" y="40" width="14" height="4"/>
            <rect x="10" y="60" width="14" height="4"/>
            <rect x="10" y="80" width="14" height="4"/>
            <rect x="10" y="100" width="14" height="4"/>
            <rect x="10" y="120" width="14" height="4"/>
            <rect x="96" y="20" width="14" height="4"/>
            <rect x="96" y="40" width="14" height="4"/>
            <rect x="96" y="60" width="14" height="4"/>
            <rect x="96" y="80" width="14" height="4"/>
            <rect x="96" y="100" width="14" height="4"/>
            <rect x="96" y="120" width="14" height="4"/>
          </g>

          <!-- الجسم الرئيسي -->
          <rect x="24" y="15" width="72" height="120" rx="8"
                fill="url(#bodyGrad)"
                stroke="#0d0d0d" stroke-width="2"/>

          <!-- تفاصيل الجسم -->
          <rect x="30" y="25" width="60" height="6" fill="#3d4a2b" opacity="0.7" rx="2"/>
          <rect x="30" y="120" width="60" height="6" fill="#3d4a2b" opacity="0.7" rx="2"/>

          <!-- البرج -->
          <circle cx="60" cy="75" r="22"
                  fill="url(#turretGrad)"
                  stroke="#0d0d0d" stroke-width="2"/>

          <!-- فتحة البرج -->
          <circle cx="60" cy="75" r="12" fill="#1a1a1a"/>
          <circle cx="60" cy="75" r="6"  fill="#0d0d0d"/>

          <!-- المدفع -->
          <rect x="55" y="20" width="10" height="55" rx="3"
                fill="#1a1a1a" stroke="#000" stroke-width="1"/>
          <rect x="57" y="18" width="6" height="8" fill="#3d4a2b"/>

          <!-- نجم/شعار على الجانب -->
          <polygon points="60,55 62,62 69,62 63,67 65,74 60,69 55,74 57,67 51,62 58,62"
                   fill="#ff7b00" opacity="0.85"/>

          <defs>
            <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"  stop-color="#7d9556"/>
              <stop offset="50%" stop-color="#5a6e3d"/>
              <stop offset="100%" stop-color="#3d4a2b"/>
            </linearGradient>
            <radialGradient id="turretGrad" cx="0.35" cy="0.35" r="0.7">
              <stop offset="0%"  stop-color="#8ba862"/>
              <stop offset="60%" stop-color="#5a6e3d"/>
              <stop offset="100%" stop-color="#2a3420"/>
            </radialGradient>
          </defs>
        </svg>
      </div>
    </div>

    <!-- ===== أيقونات جانبية ===== -->
    <div class="side-icons">
      <button class="side-icon" data-action="shop" aria-label="المتجر">🛒</button>
      <button class="side-icon" data-action="daily" aria-label="الجوائز اليومية">
        🎁<span class="badge" id="dailyBadge">1</span>
      </button>
      <button class="side-icon" data-action="maps" aria-label="الخرائط">🗺</button>
      <button class="side-icon" data-action="inventory" aria-label="الحقيبة">🎒</button>
      <button class="side-icon" data-action="achievements" aria-label="الإنجازات">🏆</button>
    </div>

    <!-- ===== الأزرار السفلية ===== -->
    <div class="bottom-actions">
      <button class="btn-play" id="btnPlay">⚔ ابدأ المعركة</button>

      <div class="btn-row">
        <button class="btn-secondary orange" data-action="shop">
          <span class="icon">🛒</span>
          <span>المتجر</span>
        </button>
        <button class="btn-secondary cyan" data-action="daily">
          <span class="icon">🎁</span>
          <span>اليومي</span>
        </button>
        <button class="btn-secondary green" data-action="maps">
          <span class="icon">🗺</span>
          <span>الخرائط</span>
        </button>
        <button class="btn-secondary red" data-action="settings">
          <span class="icon">⚙</span>
          <span>إعدادات</span>
        </button>
      </div>
    </div>

  </div>

  <!-- ============================================
       MODAL
       ============================================ -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <div class="modal-title" id="modalTitle">عنوان</div>
      <div class="modal-body" id="modalBody"></div>
      <button class="modal-close" id="modalClose">إغلاق</button>
    </div>
  </div>

  <!-- ============================================
       TOAST
       ============================================ -->
  <div class="toast" id="toast"></div>

  <!-- ============================================
       SCRIPTS
       ============================================ -->
  <script src="scripts/audio-manager.js"></script>
  <script src="scripts/app.js"></script>
</body>
</html>
