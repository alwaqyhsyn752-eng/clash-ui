<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<title>Clash of Armored</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#05070a;color:#fff;
  font-family:-apple-system,'SF Pro Display','Segoe UI',Roboto,sans-serif;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}

/* ================= SPLASH ================= */
#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;
  align-items:center;justify-content:center;overflow:hidden;
  background:radial-gradient(circle at 50% 45%,#1a0f05 0%,#0a0603 50%,#05070a 100%);
  transition:opacity .7s cubic-bezier(.4,0,.2,1)}
#splash.hide{opacity:0;pointer-events:none}

/* Mesh gradient background */
.mesh{position:absolute;inset:-20%;z-index:0;filter:blur(60px);opacity:.6}
.mesh span{position:absolute;border-radius:50%}
.mesh span:nth-child(1){width:60vw;height:60vw;left:10%;top:10%;
  background:radial-gradient(circle,#ff7b00 0%,transparent 70%);
  animation:orbit1 18s ease-in-out infinite}
.mesh span:nth-child(2){width:50vw;height:50vw;right:5%;bottom:15%;
  background:radial-gradient(circle,#00e5ff 0%,transparent 70%);
  animation:orbit2 22s ease-in-out infinite}
.mesh span:nth-child(3){width:40vw;height:40vw;left:30%;bottom:5%;
  background:radial-gradient(circle,#7dff56 0%,transparent 70%);
  animation:orbit3 20s ease-in-out infinite}
@keyframes orbit1{0%,100%{transform:translate(0,0) scale(1)}
  50%{transform:translate(15%,20%) scale(1.2)}}
@keyframes orbit2{0%,100%{transform:translate(0,0) scale(1)}
  50%{transform:translate(-15%,-20%) scale(1.15)}}
@keyframes orbit3{0%,100%{transform:translate(0,0) scale(1)}
  50%{transform:translate(-20%,15%) scale(1.1)}}

/* خطوط شبكة */
.grid{position:absolute;inset:0;z-index:1;
  background-image:linear-gradient(rgba(255,123,0,.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,123,0,.06) 1px,transparent 1px);
  background-size:50px 50px;opacity:.5;
  mask:radial-gradient(circle at 50% 50%,#000 30%,transparent 75%);
  -webkit-mask:radial-gradient(circle at 50% 50%,#000 30%,transparent 75%);
  animation:gridMove 15s linear infinite}
@keyframes gridMove{to{background-position:50px 50px}}

/* الشعار */
.logo{position:relative;z-index:3;font-family:Impact,'Arial Black',sans-serif;
  font-size:clamp(38px,11vw,72px);line-height:.95;text-align:center;
  letter-spacing:3px;opacity:0;transform:translateY(40px) scale(.85);
  animation:logoEntry 1.4s cubic-bezier(.34,1.56,.64,1) .3s forwards}
.logo span{display:block;
  background:linear-gradient(180deg,#fff 0%,#ffd8a8 20%,#ffb347 45%,#ff7b00 75%,#7a3a00 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 20px rgba(255,123,0,.9))
         drop-shadow(0 4px 0 rgba(0,0,0,.5));
  position:relative}
.logo span::after{content:attr(data-t);position:absolute;inset:0;
  background:linear-gradient(100deg,transparent 40%,rgba(255,255,255,.9) 50%,transparent 60%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:shine 3s ease-in-out infinite}
@keyframes logoEntry{to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes shine{0%,60%{background-position:-200% 0}
  100%{background-position:200% 0}}

.tag{position:relative;z-index:3;margin-top:10px;font-size:11px;font-weight:600;
  letter-spacing:10px;color:#00e5ff;text-shadow:0 0 12px #00e5ff,0 0 25px rgba(0,229,255,.5);
  opacity:0;animation:fadeIn .9s ease 1.5s forwards}
@keyframes fadeIn{to{opacity:1}}

/* شريط التحميل */
.loader{position:relative;z-index:3;width:min(82%,380px);margin-top:56px;
  opacity:0;animation:fadeIn .7s ease 1.7s forwards}
.bar{width:100%;height:12px;background:rgba(0,0,0,.7);border-radius:12px;
  overflow:hidden;position:relative;
  box-shadow:inset 0 2px 8px rgba(0,0,0,.9),
             0 0 0 1px rgba(255,123,0,.3),
             0 0 20px rgba(255,123,0,.25)}
.fill{height:100%;width:0%;border-radius:10px;position:relative;
  background:linear-gradient(90deg,#ff7b00 0%,#ffb347 50%,#00e5ff 100%);
  box-shadow:0 0 15px #ff7b00,0 0 30px #ffb347;
  transition:width .12s linear;overflow:hidden}
.fill::after{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);
  animation:shineBar 1.3s linear infinite}
@keyframes shineBar{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.bar-info{display:flex;justify-content:space-between;margin-top:14px;
  font-size:13px;font-weight:600;letter-spacing:1px;
  color:#fff;text-shadow:0 0 8px rgba(255,123,0,.6)}
.pct{color:#ffb347;font-weight:900}

.tip{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);
  z-index:3;font-size:12px;color:rgba(255,255,255,.4);letter-spacing:2px;
  opacity:0;animation:fadeIn 1s ease 2.2s forwards}

/* ================= AUTH ================= */
#auth{position:fixed;inset:0;z-index:8000;display:none;flex-direction:column;
  align-items:center;justify-content:center;padding:20px;overflow-y:auto;
  background:radial-gradient(circle at 50% 25%,rgba(255,123,0,.18),transparent 55%),
    radial-gradient(circle at 50% 80%,rgba(0,229,255,.1),transparent 60%),
    linear-gradient(180deg,#0a0d12,#05070a)}
#auth.show{display:flex}
.auth-wrap{width:100%;max-width:390px;animation:cardIn .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.auth-logo{font-family:Impact,'Arial Black',sans-serif;text-align:center;
  font-size:clamp(28px,9vw,46px);line-height:.95;letter-spacing:3px;margin-bottom:6px;
  background:linear-gradient(180deg,#fff,#ffb347 50%,#ff7b00);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 15px rgba(255,123,0,.8))}
.auth-tag{text-align:center;font-size:10px;letter-spacing:8px;color:#00e5ff;
  text-shadow:0 0 10px #00e5ff;margin-bottom:30px}
.card{background:linear-gradient(180deg,rgba(22,28,36,.92),rgba(13,18,24,.96));
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,179,71,.4);border-radius:24px;
  padding:28px 22px;position:relative;
  box-shadow:0 30px 70px rgba(0,0,0,.85),
             0 0 0 1px rgba(255,255,255,.06) inset,
             0 1px 0 rgba(255,255,255,.15) inset}
.card::before{content:'';position:absolute;inset:-1px;border-radius:24px;
  padding:1px;background:linear-gradient(135deg,rgba(255,123,0,.7),transparent 40%,rgba(0,229,255,.5));
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.7}
.card-title{font-size:18px;font-weight:800;text-align:center;margin-bottom:22px;
  letter-spacing:2px;text-shadow:0 0 12px rgba(255,179,71,.6)}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:11px;font-weight:700;color:#ffb347;
  margin-bottom:7px;letter-spacing:1.5px}
.inp{width:100%;padding:15px 16px;font-size:15px;color:#fff;
  background:rgba(0,0,0,.55);border:2px solid rgba(255,179,71,.25);
  border-radius:14px;outline:none;font-family:inherit;direction:ltr;text-align:left;
  transition:all .25s}
.inp::placeholder{color:rgba(255,255,255,.2)}
.inp:focus{border-color:#ff7b00;background:rgba(0,0,0,.7);
  box-shadow:0 0 20px rgba(255,123,0,.35),inset 0 0 8px rgba(255,123,0,.1)}
.btn{width:100%;padding:16px;font-size:14px;font-weight:800;letter-spacing:2px;
  border-radius:14px;cursor:pointer;border:none;font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:10px;
  transition:transform .08s,box-shadow .08s,filter .2s}
.btn:active{filter:brightness(1.1)}
.bp{background:linear-gradient(180deg,#ffb347 0%,#ff7b00 55%,#cc5f00 100%);
  color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.7);
  box-shadow:0 5px 0 #7a3a00,0 10px 24px rgba(255,123,0,.55),
    inset 0 1px 0 rgba(255,255,255,.5),
    inset 0 -3px 8px rgba(0,0,0,.35)}
.bp:active{transform:translateY(4px);box-shadow:0 1px 0 #7a3a00,0 3px 12px rgba(255,123,0,.5),
  inset 0 1px 0 rgba(255,255,255,.5)}
.bg1{background:#fff;color:#1a1a1a;margin-top:10px;
  box-shadow:0 5px 0 #999,0 8px 20px rgba(0,0,0,.3)}
.bg1:active{transform:translateY(4px);box-shadow:0 1px 0 #999}
.bg2{background:rgba(0,229,255,.12);color:#00e5ff;
  border:2px solid rgba(0,229,255,.5);margin-top:10px}
.bg2:active{transform:translateY(4px);background:rgba(0,229,255,.2)}
.div{display:flex;align-items:center;gap:12px;margin:20px 0;
  font-size:10px;color:rgba(255,255,255,.35);letter-spacing:3px}
.div::before,.div::after{content:'';flex:1;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,179,71,.5),transparent)}
.err{background:rgba(220,38,38,.15);border:1px solid rgba(220,38,38,.5);
  color:#ff8888;padding:12px;border-radius:12px;font-size:12px;
  margin-bottom:14px;display:none;text-align:center;font-weight:600}
.err.show{display:block}
.sw{text-align:center;margin-top:18px;font-size:12px;color:rgba(255,255,255,.5)}
.sw a{color:#ffb347;cursor:pointer;font-weight:800;text-decoration:none;
  text-shadow:0 0 8px rgba(255,179,71,.5)}
.avs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:12px 0 20px}
.av{aspect-ratio:1;border-radius:50%;background:rgba(255,179,71,.1);
  border:2px solid rgba(255,179,71,.3);color:#ffb347;
  font-size:17px;font-weight:900;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s cubic-bezier(.34,1.56,.64,1)}
.av.sel{background:linear-gradient(135deg,#ff7b00,#ffb347);color:#fff;
  border-color:#fff;transform:scale(1.15);
  box-shadow:0 0 20px #ff7b00,0 0 40px rgba(255,123,0,.5)}

/* ================= LOBBY ================= */
#lobby{position:fixed;inset:0;display:none;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg,#0a0d12 0%,#0d1218 55%,#05070a 100%)}
#lobby.show{display:flex}

.bgwrap{position:absolute;inset:0;z-index:0;overflow:hidden}
.bgwrap::before{content:'';position:absolute;inset:-25%;
  background:radial-gradient(circle at 15% 25%,rgba(255,123,0,.22),transparent 42%),
    radial-gradient(circle at 85% 65%,rgba(0,229,255,.14),transparent 48%),
    radial-gradient(circle at 50% 95%,rgba(255,123,0,.28),transparent 55%);
  animation:bgMove 14s ease-in-out infinite alternate;filter:blur(30px)}
@keyframes bgMove{to{transform:translate(-4%,3%) scale(1.1)}}
.bgwrap::after{content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle at 50% 50%,transparent 30%,rgba(0,0,0,.6) 90%);
  pointer-events:none}
.parts{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.p{position:absolute;bottom:-30px;border-radius:50%;opacity:0;animation:rise linear infinite;
  will-change:transform,opacity}
.p.fire{background:radial-gradient(circle,#ffd54f 0%,#ff7b00 35%,transparent 70%);
  box-shadow:0 0 15px #ff7b00,0 0 30px rgba(255,123,0,.5)}
.p.smoke{background:radial-gradient(circle,rgba(90,90,90,.5) 0%,transparent 70%)}
@keyframes rise{0%{transform:translateY(0) translateX(0) scale(.5);opacity:0}
  10%{opacity:.9}90%{opacity:.6}
  100%{transform:translateY(-115vh) translateX(var(--d,0)) scale(1.5);opacity:0}}

.hud{position:relative;z-index:10;display:flex;align-items:center;
  justify-content:space-between;gap:8px;padding:14px 14px 0;
  padding-top:calc(14px + env(safe-area-inset-top,0px))}
.pcard{display:flex;align-items:center;gap:10px;padding:6px 16px 6px 6px;
  background:linear-gradient(135deg,rgba(30,35,42,.75),rgba(15,18,24,.85));
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,179,71,.35);border-radius:44px;
  box-shadow:0 6px 24px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.12),
    0 0 20px rgba(255,123,0,.1);cursor:pointer;
  transition:transform .15s}
.pcard:active{transform:scale(.96)}
.pav{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:20px;font-weight:900;color:#fff;
  background:linear-gradient(135deg,#ffb347,#ff7b00);
  border:2px solid rgba(255,255,255,.4);
  box-shadow:0 0 18px rgba(255,123,0,.8),inset 0 2px 4px rgba(255,255,255,.3);
  text-shadow:0 1px 3px rgba(0,0,0,.6);position:relative}
.pav::after{content:'';position:absolute;inset:-3px;border-radius:50%;
  border:2px solid rgba(255,179,71,.6);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.8}
  50%{transform:scale(1.1);opacity:.3}}
.pinfo{display:flex;flex-direction:column;min-width:0}
.pname{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:110px;
  text-shadow:0 0 8px rgba(255,179,71,.6)}
.pline{display:flex;align-items:center;gap:6px;margin-top:3px}
.lvlb{font-size:9px;font-weight:900;padding:2px 8px;border-radius:8px;
  background:linear-gradient(135deg,#ff7b00,#ffb347);color:#000;
  letter-spacing:1px;box-shadow:0 0 8px rgba(255,123,0,.6)}
.xp{width:58px;height:5px;background:rgba(0,0,0,.7);border-radius:4px;
  overflow:hidden;border:1px solid rgba(255,179,71,.3);position:relative}
.xpf{height:100%;width:0%;border-radius:4px;transition:width .4s ease;
  background:linear-gradient(90deg,#00e5ff,#7dff56);
  box-shadow:0 0 10px #00e5ff,0 0 20px rgba(0,229,255,.5)}
.curs{display:flex;gap:6px}
.cur{display:flex;align-items:center;gap:5px;padding:7px 12px;
  background:linear-gradient(135deg,rgba(30,35,42,.75),rgba(15,18,24,.85));
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,179,71,.35);border-radius:30px;
  font-size:12px;font-weight:800;
  box-shadow:0 4px 16px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1)}
.cur.g{color:#ffd54f;text-shadow:0 0 8px rgba(255,213,79,.5)}
.cur.d{color:#00e5ff;text-shadow:0 0 8px rgba(0,229,255,.5)}
.itop{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:20px;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,rgba(30,35,42,.75),rgba(15,18,24,.85));
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,179,71,.35);
  box-shadow:0 6px 20px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.12)}
.itop:active{transform:scale(.88)}

.stage{position:relative;z-index:5;flex:1;display:flex;align-items:center;
  justify-content:center;padding:10px;min-height:0}
.tankWrap{position:relative;width:min(220px,55vw);aspect-ratio:.85;
  animation:tankFloat 4s ease-in-out infinite;
  filter:drop-shadow(0 30px 40px rgba(0,0,0,.8))
    drop-shadow(0 0 40px rgba(255,123,0,.6))}
@keyframes tankFloat{0%,100%{transform:translateY(0) rotate(-1deg)}
  50%{transform:translateY(-16px) rotate(1deg)}}
.tankWrap svg{width:100%;height:100%;display:block;overflow:visible}

.ring,.ring2{position:absolute;bottom:6%;left:50%;transform:translateX(-50%);
  border-radius:50%;pointer-events:none}
.ring{width:60%;aspect-ratio:1;border:2px dashed rgba(255,123,0,.5);
  box-shadow:0 0 40px rgba(255,123,0,.4),inset 0 0 40px rgba(255,123,0,.2);
  animation:rotate 15s linear infinite}
.ring2{width:75%;aspect-ratio:1;border:1px solid rgba(0,229,255,.3);
  animation:rotate 25s linear infinite reverse;
  box-shadow:0 0 40px rgba(0,229,255,.3)}
@keyframes rotate{to{transform:translateX(-50%) rotate(360deg)}}

.sides{position:absolute;right:12px;top:50%;transform:translateY(-50%);z-index:10;
  display:flex;flex-direction:column;gap:10px}
.sic{width:54px;height:54px;border-radius:16px;display:flex;align-items:center;
  justify-content:center;font-size:22px;cursor:pointer;color:#fff;position:relative;
  background:linear-gradient(135deg,rgba(30,35,42,.8),rgba(15,18,24,.9));
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,179,71,.4);
  box-shadow:0 8px 24px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.15),
    0 0 15px rgba(255,123,0,.15);
  transition:transform .15s}
.sic:active{transform:scale(.85)}
.sic .b{position:absolute;top:-5px;right:-5px;min-width:22px;height:22px;
  border-radius:11px;background:linear-gradient(135deg,#ff3b30,#ff7b00);
  color:#fff;font-size:11px;font-weight:900;display:flex;align-items:center;
  justify-content:center;padding:0 6px;border:2px solid #fff;
  box-shadow:0 0 15px #ff3b30;animation:bounce 1.5s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}

.bottom{position:relative;z-index:10;padding:14px;
  padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:12px}
.bPlay{position:relative;width:100%;max-width:430px;margin:0 auto;
  padding:20px 24px;font-family:Impact,'Arial Black',sans-serif;
  font-size:23px;letter-spacing:5px;color:#fff;
  text-shadow:0 2px 8px rgba(0,0,0,.9),0 0 20px rgba(255,179,71,.7);
  background:linear-gradient(180deg,#ffc670 0%,#ffb347 20%,#ff7b00 65%,#b34e00 100%);
  border:2px solid #ffd8a8;border-radius:20px;cursor:pointer;overflow:hidden;
  box-shadow:0 8px 0 #5a2800,0 14px 30px rgba(255,123,0,.6),
    inset 0 2px 0 rgba(255,255,255,.6),
    inset 0 -6px 14px rgba(0,0,0,.4),
    0 0 40px rgba(255,123,0,.35);
  transition:transform .1s,box-shadow .1s}
.bPlay::before{content:'';position:absolute;inset:0;
  background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.7) 50%,transparent 70%);
  transform:translateX(-150%);animation:bShine 3.5s ease-in-out infinite}
@keyframes bShine{0%,65%{transform:translateX(-150%)}100%{transform:translateX(150%)}}
.bPlay:active{transform:translateY(6px);
  box-shadow:0 2px 0 #5a2800,0 6px 16px rgba(255,123,0,.5),
    inset 0 2px 0 rgba(255,255,255,.6),
    inset 0 -3px 10px rgba(0,0,0,.4)}

.row{display:flex;gap:8px;justify-content:center;max-width:430px;
  margin:0 auto;width:100%}
.bsec{flex:1;padding:13px 6px;font-size:11px;font-weight:800;
  letter-spacing:1px;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,rgba(30,35,42,.8),rgba(15,18,24,.9));
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,179,71,.4);border-radius:16px;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  box-shadow:0 5px 0 rgba(0,0,0,.7),0 10px 24px rgba(0,0,0,.5),
    inset 0 1px 0 rgba(255,255,255,.12);
  transition:transform .1s,box-shadow .1s}
.bsec:active{transform:translateY(4px);
  box-shadow:0 1px 0 rgba(0,0,0,.7),0 3px 10px rgba(0,0,0,.5)}
.bsec .ic{font-size:22px;filter:drop-shadow(0 0 6px currentColor)}
.bsec.or{color:#ffb347;border-color:rgba(255,179,71,.6)}
.bsec.cy{color:#00e5ff;border-color:rgba(0,229,255,.6)}
.bsec.gr{color:#7dff56;border-color:rgba(125,255,86,.6)}
.bsec.rd{color:#ff6b6b;border-color:rgba(255,107,107,.6)}

/* MODAL */
.ov{position:fixed;inset:0;z-index:200;display:none;align-items:center;
  justify-content:center;padding:20px;background:rgba(0,0,0,.8);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  animation:fadeIn .25s ease}
.ov.show{display:flex}
.box{width:100%;max-width:430px;max-height:85vh;overflow-y:auto;
  background:linear-gradient(180deg,rgba(24,30,38,.98),rgba(13,18,24,.98));
  border:1px solid rgba(255,179,71,.45);border-radius:22px;padding:24px 20px;
  box-shadow:0 30px 70px rgba(0,0,0,.9),
    inset 0 1px 0 rgba(255,255,255,.1),
    0 0 30px rgba(255,123,0,.2);
  animation:boxIn .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes boxIn{from{opacity:0;transform:translateY(30px) scale(.94)}
  to{opacity:1;transform:translateY(0) scale(1)}}
.bt{font-family:Impact,sans-serif;font-size:24px;letter-spacing:4px;
  text-align:center;margin-bottom:20px;color:#ff7b00;
  text-shadow:0 0 15px rgba(255,123,0,.8)}
.r{display:flex;justify-content:space-between;align-items:center;
  padding:13px 0;font-size:14px;font-weight:500;
  border-bottom:1px solid rgba(255,255,255,.07)}
.r:last-child{border:none}
.bclose{width:100%;margin-top:18px;padding:15px;font-size:14px;
  font-weight:800;letter-spacing:2px;color:#fff;cursor:pointer;
  background:linear-gradient(180deg,#ff7b00,#cc5f00);
  border:1px solid #ffb347;border-radius:14px;
  box-shadow:0 5px 0 #7a3a00,inset 0 1px 0 rgba(255,255,255,.3);
  font-family:inherit}
.bclose:active{transform:translateY(4px);box-shadow:0 1px 0 #7a3a00}

.toast{position:fixed;bottom:110px;left:50%;
  transform:translateX(-50%) translateY(80px);z-index:500;
  max-width:90%;padding:14px 24px;font-size:13px;font-weight:600;
  text-align:center;color:#fff;border-radius:14px;
  background:linear-gradient(180deg,rgba(24,30,38,.98),rgba(13,18,24,.98));
  border:1px solid rgba(255,179,71,.5);
  box-shadow:0 15px 40px rgba(0,0,0,.8),0 0 25px rgba(255,123,0,.3);
  opacity:0;transition:all .35s cubic-bezier(.34,1.56,.64,1)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="mesh"><span></span><span></span><span></span></div>
  <div class="grid"></div>

  <div class="logo">
    <span data-t="CLASH">CLASH</span>
    <span data-t="OF">OF</span>
    <span data-t="ARMORED">ARMORED</span>
  </div>
  <div class="tag">SURVIVE · FIGHT · WIN</div>

  <div class="loader">
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="bar-info">
      <span>جاري التحميل</span>
      <span class="pct" id="pct">0%</span>
    </div>
  </div>
  <div class="tip" id="tip">جاري تجهيز المدرعة...</div>
</div>

<!-- AUTH -->
<div id="auth"><div class="auth-wrap" id="authWrap"></div></div>

<!-- LOBBY -->
<div id="lobby">
  <div class="bgwrap"><div class="parts" id="parts"></div></div>

  <div class="hud">
    <div class="pcard" data-act="profile">
      <div class="pav" id="pav">C</div>
      <div class="pinfo">
        <div class="pname" id="pname">Commander</div>
        <div class="pline">
          <span class="lvlb">LV <span id="plvl">1</span></span>
          <div class="xp"><div class="xpf" id="pxp"></div></div>
        </div>
      </div>
    </div>
    <div class="curs">
      <div class="cur g">🪙<span id="pgold">1500</span></div>
      <div class="cur d">💎<span id="pgems">25</span></div>
    </div>
    <button class="itop" data-act="settings">⚙</button>
  </div>

  <div class="stage">
    <div class="ring"></div>
    <div class="ring2"></div>
    <div class="tankWrap">
      <svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="track" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#3a3a3a"/>
            <stop offset="50%" stop-color="#1a1a1a"/>
            <stop offset="100%" stop-color="#0a0a0a"/>
          </linearGradient>
          <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#8fa869"/>
            <stop offset="35%" stop-color="#6f8551"/>
            <stop offset="70%" stop-color="#4a5a35"/>
            <stop offset="100%" stop-color="#2a3418"/>
          </linearGradient>
          <radialGradient id="turretG" cx=".3" cy=".3" r=".75">
            <stop offset="0%" stop-color="#a0b878"/>
            <stop offset="40%" stop-color="#6f8551"/>
            <stop offset="80%" stop-color="#3d4a2b"/>
            <stop offset="100%" stop-color="#1a2010"/>
          </radialGradient>
          <linearGradient id="barrel" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#0a0a0a"/>
            <stop offset="50%" stop-color="#3a3a3a"/>
            <stop offset="100%" stop-color="#0a0a0a"/>
          </linearGradient>
          <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>

        <!-- الجنازير -->
        <rect x="8" y="40" width="34" height="180" rx="8" fill="url(#track)"/>
        <rect x="158" y="40" width="34" height="180" rx="8" fill="url(#track)"/>
        <g fill="#252525">
          <rect x="8" y="55" width="34" height="5"/>
          <rect x="8" y="75" width="34" height="5"/>
          <rect x="8" y="95" width="34" height="5"/>
          <rect x="8" y="115" width="34" height="5"/>
          <rect x="8" y="135" width="34" height="5"/>
          <rect x="8" y="155" width="34" height="5"/>
          <rect x="8" y="175" width="34" height="5"/>
          <rect x="8" y="195" width="34" height="5"/>
          <rect x="158" y="55" width="34" height="5"/>
          <rect x="158" y="75" width="34" height="5"/>
          <rect x="158" y="95" width="34" height="5"/>
          <rect x="158" y="115" width="34" height="5"/>
          <rect x="158" y="135" width="34" height="5"/>
          <rect x="158" y="155" width="34" height="5"/>
          <rect x="158" y="175" width="34" height="5"/>
          <rect x="158" y="195" width="34" height="5"/>
        </g>

        <!-- الجسم -->
        <rect x="42" y="60" width="116" height="160" rx="14"
              fill="url(#bodyG)" stroke="#0d0d0d" stroke-width="3"/>
        <rect x="42" y="60" width="116" height="160" rx="14"
              fill="none" stroke="rgba(255,255,255,.15)" stroke-width="1.5"/>
        <rect x="52" y="75" width="96" height="8" fill="#3d4a2b" opacity=".8" rx="3"/>
        <rect x="52" y="200" width="96" height="8" fill="#3d4a2b" opacity=".8" rx="3"/>

        <!-- تفاصيل جانبية -->
        <rect x="48" y="100" width="8" height="80" fill="#2a3418" rx="2"/>
        <rect x="144" y="100" width="8" height="80" fill="#2a3418" rx="2"/>

        <!-- البرج -->
        <circle cx="100" cy="135" r="38" fill="url(#turretG)"
                stroke="#0d0d0d" stroke-width="3"/>
        <circle cx="100" cy="135" r="38" fill="none"
                stroke="rgba(255,255,255,.2)" stroke-width="1.5"/>
        <circle cx="100" cy="135" r="22" fill="#0a0a0a"/>
        <circle cx="100" cy="135" r="22" fill="none"
                stroke="rgba(255,123,0,.4)" stroke-width="1"/>
        <circle cx="100" cy="135" r="10" fill="#000"/>

        <!-- المدفع -->
        <rect x="92" y="20" width="16" height="100" rx="5"
              fill="url(#barrel)" stroke="#000" stroke-width="1.5"/>
        <rect x="88" y="16" width="24" height="16" rx="4"
              fill="#3d4a2b" stroke="#000" stroke-width="1.5"/>
        <ellipse cx="100" cy="16" rx="12" ry="5" fill="#0a0a0a" filter="url(#glow)"/>
        <ellipse cx="100" cy="16" rx="6" ry="2.5" fill="#ff7b00" opacity=".7"/>

        <!-- شعار النجم -->
        <g transform="translate(100,175)">
          <polygon points="0,-14 4,-5 14,-5 6,1 9,11 0,5 -9,11 -6,1 -14,-5 -4,-5"
                   fill="#ff7b00" opacity=".95" filter="url(#glow)"/>
        </g>

        <!-- لمعة -->
        <ellipse cx="75" cy="90" rx="30" ry="60"
                 fill="rgba(255,255,255,.08)" pointer-events="none"/>
      </svg>
    </div>
  </div>

  <div class="sides">
    <button class="sic" data-act="shop">🛒</button>
    <button class="sic" data-act="daily">🎁<span class="b" id="bdg">1</span></button>
    <button class="sic" data-act="maps">🗺</button>
    <button class="sic" data-act="inventory">🎒</button>
    <button class="sic" data-act="achievements">🏆</button>
  </div>

  <div class="bottom">
    <button class="bPlay" id="btnPlay">⚔ ابدأ المعركة</button>
    <div class="row">
      <button class="bsec or" data-act="shop"><span class="ic">🛒</span><span>المتجر</span></button>
      <button class="bsec cy" data-act="daily"><span class="ic">🎁</span><span>اليومي</span></button>
      <button class="bsec gr" data-act="maps"><span class="ic">🗺</span><span>الخرائط</span></button>
      <button class="bsec rd" data-act="settings"><span class="ic">⚙</span><span>إعدادات</span></button>
    </div>
  </div>
</div>

<div class="ov" id="ov">
  <div class="box">
    <div class="bt" id="boxT">عنوان</div>
    <div id="boxB"></div>
    <button class="bclose" onclick="closeModal()">إغلاق</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
var $ = function(id){return document.getElementById(id)};

/* CACHE */
var C = {
  set:function(k,v){try{localStorage.setItem('coa_'+k,JSON.stringify(v))}catch(e){}},
  get:function(k,d){try{var r=localStorage.getItem('coa_'+k);return r?JSON.parse(r):d}catch(e){return d}},
  del:function(k){localStorage.removeItem('coa_'+k)}
};

/* AUDIO */
var AC=null;
function tone(f,d,t,v){try{
  if(!AC){var A=window.AudioContext||window.webkitAudioContext;if(!A)return;AC=new A()}
  if(AC.state==='suspended')AC.resume();
  var o=AC.createOscillator(),g=AC.createGain();
  o.type=t||'square';o.frequency.value=f;
  g.gain.setValueAtTime(v||.12,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+(d||.08));
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+(d||.08))
}catch(e){}}
var S={
  click:function(){tone(800,.05,'square',.12)},
  success:function(){tone(600,.08,'triangle',.15);setTimeout(function(){tone(900,.12,'triangle',.15)},80)},
  error:function(){tone(220,.15,'sawtooth',.12)},
  coin:function(){tone(1200,.06,'square',.12);setTimeout(function(){tone(1600,.08,'square',.12)},60)}
};

/* PROFILE */
function getP(){return C.get('profile',null)}
function saveP(p){C.set('profile',p)}
function newP(name,av,m){
  var p={id:'p_'+Date.now(),username:name,avatar:av||'C',method:m||'guest',
    level:1,xp:0,xpMax:1000,gold:1500,gems:25,wins:0,kills:0,matches:0,
    createdAt:Date.now()};
  saveP(p);return p;
}

/* TOAST */
var tT=null;
function toast(msg,d){
  var t=$('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(tT);tT=setTimeout(function(){t.classList.remove('show')},d||2200);
}
window.toast=toast;

/* MODAL */
function openModal(t,h){
  $('boxT').textContent=t;$('boxB').innerHTML=h;$('ov').classList.add('show');
}
function closeModal(){$('ov').classList.remove('show')}
window.closeModal=closeModal;
$('ov').onclick=function(e){if(e.target===this)closeModal()};

/* SPLASH */
function splash(){
  var fill=$('fill'),pct=$('pct'),tip=$('tip');
  var tips=['جاري تجهيز المدرعة...','تحميل الأسلحة...','محاكاة المعركة...','الاتصال بالخادم...','جاهز للقتال!'];
  var ti=0,prog=0;
  var ti2=setInterval(function(){ti=(ti+1)%tips.length;tip.textContent=tips[ti]},900);
  var t=setInterval(function(){
    prog+=Math.random()*9+3;
    if(prog>=100){prog=100;clearInterval(t);clearInterval(ti2);
      setTimeout(function(){$('splash').classList.add('hide');after()},500)}
    fill.style.width=prog+'%';pct.textContent=Math.floor(prog)+'%';
  },100);
}
function after(){
  var p=getP();
  if(p&&p.id){lobby(p)}else{showLogin()}
}

/* AUTH */
var selAv='C';
function showLogin(){
  var w=$('authWrap');
  w.innerHTML=''
    +'<div class="auth-logo">CLASH OF<br>ARMORED</div>'
    +'<div class="auth-tag">SURVIVE · FIGHT · WIN</div>'
    +'<div class="card">'
    +'<div class="card-title">👤 تسجيل الدخول</div>'
    +'<div class="err" id="err"></div>'
    +'<div class="fg"><label>اسم المستخدم</label>'
    +'<input type="text" class="inp" id="inU" placeholder="Commander" maxlength="20"></div>'
    +'<button class="btn bp" id="btnL">▶ متابعة</button>'
    +'<div class="div">أو</div>'
    +'<button class="btn bg1" id="btnG"><b style="color:#4285F4;font-size:18px">G</b> الدخول بحساب Google</button>'
    +'<button class="btn bg2" id="btnX">🎮 الدخول كزائر</button>'
    +'<div class="sw">ليس لديك حساب؟ <a id="goR">أنشئ حساباً</a></div>'
    +'</div>';
  $('auth').classList.add('show');
  $('btnL').onclick=dLogin;$('btnG').onclick=dGoogle;$('btnX').onclick=dGuest;
  $('goR').onclick=showReg;
}
function showReg(){
  var avs=['A','B','C','D','E','F','G','H','J','K','L','M'];
  var h='';
  for(var i=0;i<avs.length;i++){
    h+='<div class="av'+(i===2?' sel':'')+'" data-av="'+avs[i]+'">'+avs[i]+'</div>';
  }
  var w=$('authWrap');
  w.innerHTML=''
    +'<div class="auth-logo">CLASH OF<br>ARMORED</div>'
    +'<div class="auth-tag">CREATE YOUR LEGEND</div>'
    +'<div class="card">'
    +'<div class="card-title">✚ حساب جديد</div>'
    +'<div class="err" id="err"></div>'
    +'<div class="fg"><label>اسم المستخدم</label>'
    +'<input type="text" class="inp" id="rU" placeholder="Commander" maxlength="20"></div>'
    +'<div style="font-size:11px;color:#ffb347;font-weight:700;letter-spacing:1.5px;margin-bottom:6px">اختر صورتك</div>'
    +'<div class="avs" id="avs">'+h+'</div>'
    +'<button class="btn bp" id="btnR">✚ إنشاء الحساب</button>'
    +'<div class="sw">لديك حساب؟ <a id="goL">تسجيل الدخول</a></div>'
    +'</div>';
  $('auth').classList.add('show');
  selAv='C';
  var els=document.querySelectorAll('#avs .av');
  for(var j=0;j<els.length;j++){(function(el){
    el.onclick=function(){
      for(var k=0;k<els.length;k++)els[k].classList.remove('sel');
      el.classList.add('sel');selAv=el.getAttribute('data-av');S.click();
    };
  })(els[j])}
  $('btnR').onclick=dReg;$('goL').onclick=showLogin;
}
function err(m){var e=$('err');if(e){e.textContent=m;e.classList.add('show')}S.error()}
function dReg(){
  var n=($('rU').value||'').trim();
  if(n.length<2)return err('الاسم قصير جداً');
  var p=newP(n,selAv,'email');S.success();lobby(p);
}
function dLogin(){
  var n=($('inU').value||'').trim();var p=getP();
  if(p&&n.length>=2){p.username=n;saveP(p)}
  if(!p){showReg();return}
  S.success();lobby(p);
}
function dGoogle(){
  var p=getP();
  if(!p)p=newP('GoogleUser'+Math.floor(Math.random()*9000+1000),'G','google');
  S.success();lobby(p);
}
function dGuest(){
  var p=getP();
  if(!p)p=newP('Guest'+Math.floor(Math.random()*9000+1000),'★','guest');
  S.success();lobby(p);
}

/* LOBBY */
var cur=null;
function lobby(p){
  cur=p;
  $('auth').classList.remove('show');
  $('lobby').classList.add('show');
  hud(p);parts();bind();
}
function hud(p){
  if(!p)return;
  $('pname').textContent=p.username;
  $('pav').textContent=p.avatar||'C';
  $('plvl').textContent=p.level;
  $('pxp').style.width=((p.xp/p.xpMax)*100)+'%';
  $('pgold').textContent=p.gold.toLocaleString();
  $('pgems').textContent=p.gems;
}
function parts(){
  var box=$('parts');if(box.dataset.on)return;box.dataset.on='1';
  function mk(k){
    var d=document.createElement('div');d.className='p '+k;
    var sz=k==='fire'?10+Math.random()*16:22+Math.random()*34;
    d.style.width=sz+'px';d.style.height=sz+'px';
    d.style.left=Math.random()*100+'%';
    d.style.setProperty('--d',(Math.random()*200-100)+'px');
    var dur=k==='fire'?3+Math.random()*2.5:6+Math.random()*4;
    d.style.animationDuration=dur+'s';
    d.style.animationDelay=(Math.random()*4)+'s';
    box.appendChild(d);
    setTimeout(function(){d.remove()},(dur+4)*1000);
  }
  for(var i=0;i<12;i++)mk('fire');
  for(var j=0;j<6;j++)mk('smoke');
  setInterval(function(){mk('fire');if(Math.random()>.5)mk('smoke')},900);
}
function bind(){
  $('btnPlay').onclick=function(){
    S.click();toast('⚔ جاري تحميل المعركة...');
    setTimeout(function(){window.location.href='game/index.html'},700);
  };
  var els=document.querySelectorAll('[data-act]');
  for(var i=0;i<els.length;i++){(function(el){
    el.onclick=function(){S.click();act(el.getAttribute('data-act'))};
  })(els[i])}
}
function act(a){
  if(a==='settings')return openModal('الإعدادات',
    '<div class="r"><span>🔊 الصوت</span><span>70%</span></div>'
    +'<div class="r"><span>🎮 الحساسية</span><span>5</span></div>'
    +'<div class="r"><span>📳 الاهتزاز</span><span style="color:#7dff56">مفعّل</span></div>');
  if(a==='shop')return openModal('المتجر',
    '<div class="r"><span>💎 100 جوهرة</span><span style="color:#ffd54f">1000 🪙</span></div>'
    +'<div class="r"><span>🛡 ترقية المدرعة</span><span style="color:#ffd54f">500 🪙</span></div>'
    +'<div class="r"><span>🔥 قذائف سريعة ×10</span><span style="color:#ffd54f">250 🪙</span></div>');
  if(a==='maps')return openModal('الخرائط',
    '<div class="r"><span>🗺 ساحة التدريب</span><span style="color:#7dff56">✓ مفتوحة</span></div>'
    +'<div class="r"><span>🏭 مصنع مهجور</span><span style="color:#9a9a9a">🔒</span></div>'
    +'<div class="r"><span>🏜 صحراء الجحيم</span><span style="color:#9a9a9a">🔒</span></div>'
    +'<div class="r"><span>❄ أرض الجليد</span><span style="color:#9a9a9a">🔒</span></div>');
  if(a==='achievements')return openModal('الإنجازات',
    '<div class="r"><span>🎯 أول فوز</span><span style="color:#7dff56">✓</span></div>'
    +'<div class="r"><span>💀 10 قتلات</span><span>3/10</span></div>'
    +'<div class="r"><span>🏆 50 قتلة</span><span>0/50</span></div>');
  if(a==='inventory')return openModal('الحقيبة',
    '<div class="r"><span>🔫 مدفع أساسي</span><span style="color:#00e5ff">مفعّل</span></div>'
    +'<div class="r"><span>🛡 درع خفيف</span><span style="color:#00e5ff">مفعّل</span></div>'
    +'<div class="r"><span>💥 قذيفة HE</span><span>×5</span></div>');
  if(a==='daily'){
    cur.gold+=200;cur.gems+=5;saveP(cur);hud(cur);S.coin();
    var b=$('bdg');if(b)b.style.display='none';
    return toast('🎁 استلمت 200 ذهب + 5 جواهر!');
  }
  if(a==='profile'){
    var rate=cur.matches?Math.round((cur.wins/cur.matches)*100):0;
    return openModal('الملف الشخصي',
      '<div style="text-align:center;margin-bottom:16px">'
      +'<div style="width:76px;height:76px;border-radius:50%;margin:0 auto 12px;'
      +'background:linear-gradient(135deg,#ffb347,#ff7b00);display:flex;'
      +'align-items:center;justify-content:center;font-size:30px;font-weight:900;'
      +'border:3px solid #fff;box-shadow:0 0 30px rgba(255,123,0,.8)">'+(cur.avatar||'C')+'</div>'
      +'<div style="font-size:18px;font-weight:900">'+cur.username+'</div>'
      +'</div>'
      +'<div class="r"><span>🏆 المستوى</span><span style="color:#ffb347;font-weight:900">'+cur.level+'</span></div>'
      +'<div class="r"><span>🎯 المباريات</span><span>'+cur.matches+'</span></div>'
      +'<div class="r"><span>🥇 الانتصارات</span><span style="color:#7dff56;font-weight:900">'+cur.wins+'</span></div>'
      +'<div class="r"><span>💀 القتلات</span><span style="color:#ff6b6b;font-weight:900">'+cur.kills+'</span></div>'
      +'<div class="r"><span>📊 نسبة الفوز</span><span>'+rate+'%</span></div>'
      +'<button class="bclose" style="background:linear-gradient(180deg,#dc2626,#991b1b);box-shadow:0 5px 0 #5a0000" onclick="logout()">🚪 تسجيل الخروج</button>');
  }
  toast('🚧 قيد التطوير');
}
function logout(){
  C.del('profile');closeModal();
  $('lobby').classList.remove('show');showLogin();
}
window.logout=logout;

/* BOOT */
window.addEventListener('DOMContentLoaded',function(){
  setTimeout(splash,100);
});
})();
</script>
</body>
</html>
